<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<meta name="description" content="فواتير نيو بلان للتوريدات">
<title>فواتير نيو بلان</title>

<script src="vendor/jspdf.umd.min.js"></script>
<style>
/* Mobile-first single column: brand header, three working tabs, a sticky total bar, and an invoice drawn on canvas in the sheet's navy and gold. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E8EDF5; --ink:#14233A; --muted:#5B6980; --line:#D9E0EA;
  --brand:#1F3A5F; --onbrand:#FFFFFF; --gold:#9A7611; --goldline:#C9A227; --danger:#B3261E; --ok:#1E7A4C;
  --font:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --display:'Reem Kufi','Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;
  --navh:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1524; --surface:#162239; --surface2:#1E2D49; --ink:#E7EDF7; --muted:#9BA9C0; --line:#2A3A58;
    --brand:#8FB1E8; --onbrand:#0D1524; --gold:#E3BC4B; --goldline:#E3BC4B; --danger:#FF8A80; --ok:#6FD3A0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1524; --surface:#162239; --surface2:#1E2D49; --ink:#E7EDF7; --muted:#9BA9C0; --line:#2A3A58;
  --brand:#8FB1E8; --onbrand:#0D1524; --gold:#E3BC4B; --goldline:#E3BC4B; --danger:#FF8A80; --ok:#6FD3A0;
  color-scheme:dark;
}
[hidden]{display:none!important}
img{max-width:100%}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:0; padding-bottom:0; min-height:100vh; overflow-x:clip;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.shell{max-width:560px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:12px 6px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;color:var(--brand);display:flex;align-items:center;gap:9px;line-height:1}
.brand i{width:9px;height:9px;background:var(--goldline);transform:rotate(45deg);display:block}
.chip{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
main{padding-bottom:calc(var(--navh) + 100px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--display);font-size:28px;line-height:1.25;margin:10px 0 14px;font-weight:700;text-wrap:balance}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:22px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.fields .full{grid-column:1/-1}
@media (max-width:370px){.fields{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
input{font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;height:46px;padding:0 12px;width:100%;min-width:0}
input[readonly]{background:var(--surface2);color:var(--muted)}
input::placeholder{color:var(--muted);opacity:.7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:15px;text-decoration:none;text-align:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.btn.ghost{background:transparent}
.btn.sm{height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:default}
.link{display:block;width:100%;background:none;border:0;color:var(--muted);font-weight:700;font-size:14px;padding:12px 0}
.link.danger,.armed{color:var(--danger)}
.add{width:100%;height:52px;margin-top:12px;border:1.5px dashed var(--goldline);color:var(--brand);background:transparent;border-radius:12px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.item{padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.i-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.i-name{font-weight:700;overflow-wrap:anywhere}
.i-unit{font-size:12px;color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.x:hover{background:var(--surface2)}
.i-ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
.price{display:flex;align-items:center;gap:6px;flex:1 1 130px;min-width:0;font-size:13px;color:var(--muted)}
.price input:placeholder-shown{border-color:var(--goldline);border-width:1.5px}
.price input,.stepper input{height:40px;text-align:center;font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stepper button{width:40px;height:40px;border:0;background:transparent;color:var(--brand);font-size:22px;line-height:1}
.stepper input{width:52px;border:0;border-radius:0;padding:0;background:transparent}
.i-total{margin-inline-start:auto;font-weight:800;font-variant-numeric:tabular-nums}
.sum{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.sum:first-child{border-top:0}
.sum input{width:130px;height:40px;text-align:center}
.sum.grand{background:var(--surface2);font-size:18px;font-weight:800}
.bar{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.b-tot{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2;font-size:12px;color:var(--muted)}
.b-tot b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface2);border-radius:12px}
.seg button{height:42px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--navh)}
.tab{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700}
.tab[aria-current="page"]{color:var(--brand);box-shadow:inset 0 3px 0 var(--goldline)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);text-align:start}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted)}
.row .v{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .cnt{background:var(--brand);color:var(--onbrand);border-radius:999px;font-size:12px;font-weight:700;padding:0 8px;min-width:26px;text-align:center}
.tag{font-size:11px;font-weight:700;color:var(--gold);border:1px solid var(--goldline);border-radius:6px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
.tools{display:flex;gap:10px;margin-bottom:12px}
.tools input{flex:1}
.empty{text-align:center;color:var(--muted);padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty.sm{padding:20px 14px}
.empty b{color:var(--ink);font-size:17px}
.sheet-bd{position:fixed;inset:0;background:rgba(8,14,26,.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:88vh;display:flex;flex-direction:column;padding:0 max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-in{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;min-height:0}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 4px}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:8px 0 10px;font-size:18px}
.sh-body{display:flex;flex-direction:column;gap:12px;padding-bottom:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plist{overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.err{color:var(--danger);font-size:13px;min-height:0}
.pv{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pv-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--brand);font-weight:700;font-size:16px;height:40px;padding:0}
.pv-scroll{flex:1;overflow:auto;padding:6px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.pv-scroll .wrap{max-width:560px;margin:0 auto}
.pv-scroll canvas{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 2px 16px rgba(0,0,0,.22);background:#fff}
.pv-load{padding:60px 0;text-align:center;color:var(--muted)}
.pv-actions{background:var(--surface);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pv-actions .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.pv ~ .toast,.toast.high{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>

</head>
<body>
<div class="shell">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<div class="bar" id="bar" hidden></div>
<nav class="tabs" id="tabs" aria-label="التنقل"><div class="in" id="tabsin"></div></nav>
<div id="sheet"></div>
<div class="pv" id="pv" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
document.documentElement.lang='ar'; document.documentElement.dir='rtl';
var $=function(s){return document.querySelector(s)};
var NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
function toB64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=rej;r.readAsDataURL(blob)})}
async function nativeShare(blob,name,inv){
  var P=Capacitor.Plugins,b64=await toB64(blob);
  var ext=name.slice(name.lastIndexOf('.'));
  var plain='NewPlan-'+(inv.type==='quote'?'Quote':'Invoice')+'-'+String(inv.no).replace(/[^A-Za-z0-9]/g,'')+ext;
  var w=await P.Filesystem.writeFile({path:plain,data:b64,directory:'CACHE'});
  await P.Share.share({title:tl(inv).t+' '+inv.no,files:[w.uri],dialogTitle:'إرسال'});
}
var CO={name:'نيو بلان للتوريدات',en:'NEW PLAN  |  Supplies',phone:'01200609398',phone2:'01062583043',owner:'حسن يحي'};
var S={tab:'invoice',mode:'init',db:null,dl:undefined,pLoaded:false,iLoaded:false,products:[],invoices:[],draft:null,
  prq:'',pq:'',iq:'',sheet:null,pv:null,busy:false,arm:null,armT:0,saved:{}};

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){
  if(typeof v==='number')return isFinite(v)?v:0;
  var t=String(v==null?'':v).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[٫,،]/g,'.').replace(/[^\d.\-]/g,'');
  var n=parseFloat(t); return isFinite(n)?n:0;
}
function money(n){return (Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function qf(n){return String(Math.round(num(n)*1000)/1000)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(iso){var p=String(iso||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(iso||'')}
var LS={get:function(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}
function isSaved(id){return !!S.saved[id]||S.invoices.some(function(x){return x.id===id})}
function loaded(){return S.mode==='local'||(S.pLoaded&&S.iLoaded)}
function sortAll(){
  S.products.sort(function(a,b){return String(a.name).localeCompare(String(b.name),'ar')});
  S.invoices.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
}
var TL={
  invoice:{t:'فاتورة',no:'رقم الفاتورة',newT:'فاتورة جديدة',editT:'تعديل فاتورة'},
  quote:{t:'عرض سعر',no:'رقم عرض السعر',newT:'عرض سعر جديد',editT:'تعديل عرض سعر'}
};
function tl(x){return TL[(x&&x.type)||'invoice']||TL.invoice}
function nextNo(type){
  type=type||'invoice';var m=1000;
  S.invoices.forEach(function(i){if((i.type||'invoice')!==type)return;var n=parseInt(String(i.no).replace(/\D/g,''),10);if(n>m)m=n});
  return String(m+1);
}
function newDraft(type){type=type||'invoice';return {id:uid(),type:type,no:nextNo(type),noAuto:true,date:today(),client:'',phone:'',items:[],discount:'',createdAt:null}}
function totals(items,discount){
  var sub=items.reduce(function(a,i){return a+num(i.qty)*num(i.price)},0);
  var disc=Math.min(Math.max(num(discount),0),sub);
  return {sub:sub,disc:disc,total:sub-disc};
}
function normInv(d){
  var isQ=d.type==='quote';
  var items=d.items.filter(function(i){return i.name&&(isQ||num(i.qty)>0)}).map(function(i){return {name:i.name,unit:i.unit||'',qty:isQ?1:num(i.qty),price:num(i.price)}});
  var t=isQ?{sub:0,disc:0,total:0}:totals(items,d.discount);
  return {id:d.id,type:d.type||'invoice',no:String(d.no||'').trim(),date:d.date||today(),client:String(d.client||'').trim(),phone:String(d.phone||'').trim(),
    items:items,discount:t.disc,subtotal:t.sub,total:t.total,createdAt:d.createdAt||Date.now(),updatedAt:Date.now()};
}
function cleanInv(i){return {type:i.type||'invoice',no:i.no,date:i.date,client:i.client,phone:i.phone,items:i.items,discount:i.discount,subtotal:i.subtotal,total:i.total,createdAt:i.createdAt,updatedAt:i.updatedAt}}
var dt;function saveDraftSoon(){clearTimeout(dt);dt=setTimeout(function(){LS.set('np_draft',S.draft)},400)}

/* ---------- storage: shared db when available, this device otherwise ---------- */
function put(col,id,data){
  if(S.mode==='db')return S.db.doc(col+'/'+id).set(data);
  var arr=S[col],row=Object.assign({id:id},data),i=arr.findIndex(function(x){return x.id===id});
  if(i>=0)arr[i]=row;else arr.push(row);
  sortAll();LS.set('np_'+col,arr);
  return Promise.resolve();
}
function remove(col,id){
  if(S.mode==='db')return S.db.doc(col+'/'+id).delete();
  S[col]=S[col].filter(function(x){return x.id!==id});LS.set('np_'+col,S[col]);
  return Promise.resolve();
}
function werr(e){
  var c=e&&e.code;
  if(c==='invalid_argument')toast('مالكش صلاحية التعديل على الملف ده');
  else if(c==='quota_exceeded')toast('المساحة امتلت. امسح بيانات قديمة');
  else toast('مقدرتش أحفظ. جرب تاني');
}
function useLocal(){
  S.mode='local';S.products=LS.get('np_products')||[];S.invoices=LS.get('np_invoices')||[];sortAll();
  if(S.draft&&S.draft.noAuto&&!isSaved(S.draft.id))S.draft.no=nextNo(S.draft.type);
  renderTop();onData();
}
function onData(){
  if(S.draft.noAuto&&!isSaved(S.draft.id)){
    S.draft.no=nextNo(S.draft.type);var i=$('#d-no');if(i&&document.activeElement!==i)i.value=S.draft.no;
  }
  if(S.tab==='products')renderPrList();
  if(S.tab==='history')renderIList();
  if(S.sheet&&S.sheet.type==='pick')renderPList();
  if(S.pv)renderPvActions();
}
async function boot(){
  var d=LS.get('np_draft');
  S.draft=(d&&d.id&&Array.isArray(d.items))?d:newDraft();
  if(!S.draft.type)S.draft.type='invoice';
  renderAll();
  var c=window.claude;
  if(!c||!c.use){useLocal();return}
  var dbn=null;
  try{dbn=await c.use('db')}catch(e){dbn=null}
  try{c.use('downloads').then(function(x){S.dl=x;if(S.pv)renderPvActions()}).catch(function(){S.dl=null})}catch(e){S.dl=null}
  if(!dbn){useLocal();return}
  S.db=dbn;S.mode='db';renderTop();
  function fail(){if(S.mode==='db'){toast('الاتصال بالتخزين فصل. الشغل هيتحفظ على الجهاز ده');useLocal()}}
  S.db.collection('products').onSnapshot(function(s){
    S.products=s.docs.map(function(x){return Object.assign({id:x.id},x.data())});sortAll();S.pLoaded=true;onData();
  },fail);
  S.db.collection('invoices').onSnapshot(function(s){
    S.invoices=s.docs.map(function(x){return Object.assign({id:x.id},x.data())});sortAll();S.iLoaded=true;onData();
  },fail);
}

/* ---------- chrome ---------- */
var ICON={
  invoice:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
  history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  box:'<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'
};
function svg(p,s){return '<svg viewBox="0 0 24 24" width="'+(s||22)+'" height="'+(s||22)+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'}
var X_ICON=svg('<path d="M6 6l12 12M18 6L6 18"/>',18);
function renderTop(){
  $('#top').innerHTML='<div class="brand"><i></i>نيو بلان</div>'+(S.mode==='local'?'<span class="chip">محفوظ على الجهاز ده بس</span>':'');
}
function renderTabs(){

function pngName(inv){return safeName(tl(inv).t+' '+inv.no+' - '+inv.client)+'.png'}
async function shareWa(){
  var p=S.pv;if(!p||!p.canvas||S.busy)return;
  S.busy=true;renderPvActions();
  try{
    var blob=p.png||await new Promise(function(r){p.canvas.toBlob(r,'image/png')});
    var name=pngName(p.inv),file=null;
    if(NATIVE){
      await nativeShare(blob,name,p.inv);
      if(p.from==='draft'&&!isSaved(p.inv.id))await saveCurrent(true);
      return;
    }
    try{file=new File([blob],name,{type:'image/png'})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file]});
        if(p.from==='draft'&&!isSaved(p.inv.id))await saveCurrent(true);
        return;
      }catch(e){if(e&&e.name==='AbortError')return}
    }
    if(p.from==='draft'&&!isSaved(p.inv.id))await saveCurrent(true);
    if(S.dl){await S.dl.save({filename:name,data:blob})}
    else{
      var url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},4000);

async function saveCurrent(silent){
  var p=S.pv;if(!p)return false;
  try{await put('invoices',p.inv.id,cleanInv(p.inv));S.saved[p.inv.id]=1;if(!silent){toast('اتحفظ');renderPvActions()}return true}

function safeName(s){return String(s).replace(/[\\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,120)}
function makePdf(J,cv){
  var pdf=new J({unit:'mm',format:'a4',compress:true});
  var img=cv.toDataURL('image/jpeg',0.92),w=210,h=w*cv.height/cv.width,left=h-297,y=0;
  pdf.addImage(img,'JPEG',0,y,w,h);
  while(left>0){y-=297;pdf.addPage();pdf.addImage(img,'JPEG',0,y,w,h);left-=297}
  return pdf.output('blob');
}
async function exportFile(kind){
  var p=S.pv;if(!p||!p.canvas||S.busy)return;
  S.busy=true;renderPvActions();
  try{
    if(p.from==='draft'&&!isSaved(p.inv.id))await saveCurrent(true);
    var dl=S.dl||null;
    var base=safeName(tl(p.inv).t+' '+p.inv.no+' - '+p.inv.client),blob,name;
    if(kind==='pdf'){
      var J=window.jspdf&&window.jspdf.jsPDF;
      if(!J){toast('مقدرتش أجهز PDF. نزّل صورة بدله.');return}
      blob=makePdf(J,p.canvas);name=base+'.pdf';
    }else{
      blob=p.png||await new Promise(function(r){p.canvas.toBlob(r,'image/png')});name=base+'.png';
    }
    if(NATIVE){await nativeShare(blob,name,p.inv);return}
    if(dl){await dl.save({filename:name,data:blob})}
    else{
      var url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},4000);
    }
    toast('اتحمل الملف');
  }catch(e){
    if(e&&e.code==='declined')return;
    toast('مقدرتش أنزّل الملف. جرب تاني.');
  }finally{S.busy=false;renderPvActions()}
}

/* ---------- canvas invoice (same navy and gold as the sheet) ---------- */
function fontStr(w,s,k){return w+' '+s+'px '+(k==='kufi'?'"Reem Kufi",Cairo':'Cairo')+', "Segoe UI", Tahoma, sans-serif'}
async function drawInvoice(inv){
  try{var AR_='فاتورة عرض سعر ٠١٢ 012';await Promise.all([document.fonts.load('400 20px Cairo',AR_),document.fonts.load('600 20px Cairo',AR_),document.fonts.load('700 20px Cairo',AR_),document.fonts.load('800 20px Cairo',AR_),document.fonts.load('700 40px "Reem Kufi"',AR_)])}catch(e){}
  var isQ=inv.type==='quote';
  var W=794,SC=2,M=40,NAVY='#1F3A5F',GOLD='#C9A227',INK='#14233A',MUTED='#5B6980',BAND='#EEF2F8',LINE='#C5CEDB';
  var rows=Math.max(8,inv.items.length),RH=40,hasDisc=!isQ&&inv.discount>0;
  var HD=182,o=HD-150;
  var yT=348+o,yRows=yT+42,yTot=yRows+rows*RH,subH=38,totH=50;
  var yAfter=isQ?yTot:yTot+subH+(hasDisc?subH:0)+totH;
  var H=yAfter+110;
  var cv=document.createElement('canvas');cv.width=W*SC;cv.height=H*SC;
  var c=cv.getContext('2d');c.scale(SC,SC);c.textBaseline='middle';c.direction='rtl';
  c.fillStyle='#fff';c.fillRect(0,0,W,H);
  function T(t,x,y,font,color,al){c.font=font;c.fillStyle=color;c.textAlign=al||'center';c.fillText(t,x,y)}
  function fit(t,maxW){
    t=String(t);if(c.measureText(t).width<=maxW)return t;
    while(t.length>1&&c.measureText(t+'…').width>maxW)t=t.slice(0,-1);return t+'…';
  }
  function chat(x,y,s){
    c.fillStyle='#25D366';c.beginPath();c.arc(x+s/2,y+s/2,s/2,0,Math.PI*2);c.fill();
    c.fillStyle='#fff';c.beginPath();c.ellipse(x+s/2,y+s/2-1,s*0.29,s*0.25,0,0,Math.PI*2);c.fill();
    c.beginPath();c.moveTo(x+s*0.30,y+s*0.62);c.lineTo(x+s*0.24,y+s*0.82);c.lineTo(x+s*0.46,y+s*0.70);c.closePath();c.fill();
    c.fillStyle='#25D366';
    for(var k=0;k<3;k++){c.beginPath();c.arc(x+s*(0.37+k*0.13),y+s/2-1,s*0.045,0,Math.PI*2);c.fill()}
  }
  // header
  c.fillStyle=NAVY;c.fillRect(0,0,W,HD);c.fillStyle=GOLD;c.fillRect(0,HD,W,6);
  T(CO.name,W/2,50,fontStr(700,46,'kufi'),'#fff');
  c.direction='ltr';try{c.letterSpacing='4px'}catch(e){}
  T(CO.en,W/2,90,fontStr(700,15),GOLD);
  try{c.letterSpacing='0px'}catch(e){}c.direction='rtl';
  T('إدارة / '+CO.owner,W/2,123,fontStr(700,21),'#fff');
  var ph='تليفون وواتساب: '+CO.phone+'  -  '+CO.phone2;
  c.font=fontStr(700,19);
  var tw=c.measureText(ph).width,iw=26,gp=9,sx=(W-(tw+gp+iw))/2;
  chat(sx,156-iw/2,iw);
  T(ph,sx+iw+gp,156,fontStr(700,19),'#fff','left');
  // title and meta
  T(tl(inv).t,W-M,196+o,fontStr(700,36,'kufi'),NAVY,'right');
  T(tl(inv).no+': '+inv.no,W-M,232+o,fontStr(700,18),INK,'right');
  T('التاريخ: '+fmtDate(inv.date),M,196+o,fontStr(700,18),INK,'left');
  // client box
  var yc=256+o;
  c.fillStyle=BAND;c.fillRect(M,yc,W-2*M,74);c.strokeStyle=LINE;c.lineWidth=1;c.strokeRect(M+.5,yc+.5,W-2*M-1,73);
  T('العميل',W-M-16,yc+18,fontStr(600,13),MUTED,'right');
  c.font=fontStr(700,21);T(fit(inv.client||'—',360),W-M-16,yc+47,fontStr(700,21),INK,'right');
  T('تليفون العميل',M+16,yc+18,fontStr(600,13),MUTED,'left');
  T(inv.phone||'—',M+16,yc+47,fontStr(700,19),INK,'left');
  // table
  var col=isQ?{m:[704,754],n:[284,704],t:[40,284]}:{m:[704,754],n:[404,704],q:[324,404],p:[194,324],t:[40,194]};
  function mid(a){return (a[0]+a[1])/2}
  c.fillStyle=NAVY;c.fillRect(M,yT,W-2*M,42);
  var hf=fontStr(700,16);
  T('م',mid(col.m),yT+21,hf,'#fff');T('الصنف',col.n[1]-14,yT+21,hf,'#fff','right');
  if(isQ){T('السعر',mid(col.t),yT+21,hf,'#fff')}
  else{T('العدد',mid(col.q),yT+21,hf,'#fff');T('السعر',mid(col.p),yT+21,hf,'#fff');T('الإجمالي',mid(col.t),yT+21,hf,'#fff')}
  for(var r=0;r<rows;r++){
    var y=yRows+r*RH;
    if(r%2===1){c.fillStyle=BAND;c.fillRect(M,y,W-2*M,RH)}
    var it=inv.items[r];
    if(it){
      var f=fontStr(600,16);
      T(String(r+1),mid(col.m),y+RH/2,f,INK);
      c.font=f;T(fit(it.name,col.n[1]-col.n[0]-24),col.n[1]-14,y+RH/2,f,INK,'right');
      if(isQ){T(money(it.price),mid(col.t),y+RH/2,fontStr(700,16),INK)}
      else{
        T(qf(it.qty),mid(col.q),y+RH/2,f,INK);
        T(money(it.price),mid(col.p),y+RH/2,f,INK);
        T(money(it.qty*it.price),mid(col.t),y+RH/2,fontStr(700,16),INK);
      }
    }
    c.strokeStyle=LINE;c.beginPath();c.moveTo(M,y+RH+.5);c.lineTo(W-M,y+RH+.5);c.stroke();
  }
  c.strokeStyle=LINE;c.strokeRect(M+.5,yT+.5,W-2*M-1,42+rows*RH-1);
  // totals (invoices only)
  if(!isQ){
    var y2=yTot;
    var sumRow=function(label,val,h,navy){
      c.fillStyle=navy?NAVY:BAND;c.fillRect(M,y2,W-2*M,h);
      c.strokeStyle=navy?NAVY:LINE;c.strokeRect(M+.5,y2+.5,W-2*M-1,h-1);
      T(label,(col.p[0]+col.m[1])/2,y2+h/2,fontStr(700,navy?20:16),navy?'#fff':INK);
      T(val,mid(col.t),y2+h/2,fontStr(800,navy?22:17),navy?'#fff':INK);
      y2+=h;
    };
    sumRow('الإجمالي الفرعي',money(inv.subtotal),subH,false);
    if(hasDisc)sumRow('الخصم',money(inv.discount),subH,false);
    sumRow('الإجمالي النهائي (ج.م)',money(inv.total),totH,true);
  }
  // footer
  T('شكراً لتعاملكم معنا  -  '+CO.name,W/2,yAfter+34,fontStr(700,16),NAVY);
  T(CO.phone+'  -  '+CO.phone2,W/2,yAfter+60,fontStr(700,16),NAVY);
  c.fillStyle=GOLD;c.fillRect(0,H-8,W,8);
  return cv;
}

/* ---------- events ---------- */
function confirmTap(b,key){
  if(S.arm===key){S.arm=null;clearTimeout(S.armT);return true}
  S.arm=key;var o=b.textContent;b.textContent='اضغط تاني للتأكيد';b.classList.add('armed');
  clearTimeout(S.armT);S.armT=setTimeout(function(){S.arm=null;b.textContent=o;b.classList.remove('armed')},3000);
  return false;
}
function loadIntoDraft(inv){
  S.draft={id:inv.id,type:inv.type||'invoice',no:inv.no,noAuto:false,date:inv.date,client:inv.client,phone:inv.phone||'',discount:inv.discount?String(inv.discount):'',createdAt:inv.createdAt||null,
    items:(inv.items||[]).map(function(i){return {id:uid(),pid:null,name:i.name,unit:i.unit||'',qty:i.qty,price:i.price}})};
  LS.set('np_draft',S.draft);
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,id=b.dataset.id,it;
  switch(a){
    case 'tab':if(S.pv)closePreview();S.sheet=null;S.tab=id;renderSheet();renderAll();window.scrollTo(0,0);break;
    case 'goto-products':S.sheet=null;S.tab='products';renderSheet();renderAll();break;
    case 'open-picker':S.pq='';openSheet({type:'pick'});break;
    case 'doctype':
      if(S.draft.type===id)break;
      S.draft.type=id;
      if(isSaved(S.draft.id)){S.draft.id=uid();S.draft.createdAt=null;S.draft.noAuto=true}
      if(S.draft.noAuto)S.draft.no=nextNo(id);
      LS.set('np_draft',S.draft);viewInvoice();renderBar();break;
    case 'close-sheet':closeSheet();break;
    case 'pick':addProduct(id);break;
    case 'inc':case 'dec':
      it=S.draft.items.find(function(x){return x.id===id});if(!it)break;
      it.qty=a==='inc'?num(it.qty)+1:Math.max(1,num(it.qty)-1);renderItems();updateTotals();saveDraftSoon();break;
    case 'rm':S.draft.items=S.draft.items.filter(function(x){return x.id!==id});renderItems();updateTotals();saveDraftSoon();break;
    case 'preview':tryPreview();break;
    case 'reset':if(confirmTap(b,'reset')){S.draft=newDraft(S.draft.type);LS.set('np_draft',null);viewInvoice();renderBar();toast('تم المسح')}break;
    case 'pv-close':closePreview();break;
    case 'pdf':exportFile('pdf');break;
    case 'img':exportFile('img');break;
    case 'wa':shareWa();break;
    case 'save':saveCurrent(false);break;
    case 'new-after':S.draft=newDraft(S.draft.type);LS.set('np_draft',null);closePreview();S.tab='invoice';renderAll();window.scrollTo(0,0);break;
    case 'edit':loadIntoDraft(S.pv.inv);closePreview();S.tab='invoice';renderAll();window.scrollTo(0,0);break;
    case 'del-inv':
      if(confirmTap(b,'del-inv')){
        var did=S.pv.inv.id;
        remove('invoices',did).then(function(){delete S.saved[did];closePreview();toast('اتحذف');if(S.tab==='history')renderIList()}).catch(werr);
      }break;
    case 'open-inv':it=S.invoices.find(function(x){return x.id===id});if(it)openPreview(JSON.parse(JSON.stringify(it)),'history');break;
    case 'new-prod':openSheet({type:'prod',id:null});break;
    case 'edit-prod':openSheet({type:'prod',id:id});break;
    case 'save-prod':saveProduct();break;
    case 'del-prod':
      if(confirmTap(b,'del-prod')){
        remove('products',id).then(function(){closeSheet();toast('اتحذف المنتج');if(S.tab==='products')renderPrList()}).catch(werr);
      }break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.d){
    S.draft[t.dataset.d]=t.value;
    if(t.dataset.d==='date')S.draft.dateEdited=true;
    if(t.dataset.d==='no')S.draft.noAuto=false;
    if(t.dataset.d==='discount')updateTotals();
    saveDraftSoon();
  }else if(t.dataset.it){
    var it=S.draft.items.find(function(x){return x.id===t.dataset.id});
    if(it){it[t.dataset.it]=t.value;updateTotals();saveDraftSoon()}
  }else if(t.id==='pq'){S.pq=t.value;renderPList()}
  else if(t.id==='prq'){S.prq=t.value;renderPrList()}
  else if(t.id==='iq'){S.iq=t.value;renderIList()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(S.sheet)closeSheet();else if(S.pv)closePreview()}
});

if(NATIVE&&Capacitor.Plugins.App){
  Capacitor.Plugins.App.addListener('backButton',function(){
    if(S.sheet)closeSheet();
    else if(S.pv)closePreview();
    else if(S.tab!=='invoice'){S.tab='invoice';renderAll();window.scrollTo(0,0)}
    else Capacitor.Plugins.App.exitApp();
  });
}
boot();
})();
</script>
