name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Create the Android project
        run: |
          npx cap add android
          cp -r resources/res/. android/app/src/main/res/
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NewPlan-Invoices-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK on the Releases page
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NewPlan-Invoices.apk
          gh release delete apk-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-latest NewPlan-Invoices.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "تطبيق فواتير نيو بلان" \
            --notes "آخر نسخة من التطبيق. نزّل الملف NewPlan-Invoices.apk وثبّته على الأندرويد."
